name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 버전 계산에 태그 기록이 필요하다

      - name: Build (애드온 zip + 목록 + 애드온 도우미 exe)
        shell: pwsh
        run: |
          $buildArgs = @{ Zip = $true; Helper = $true }
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $buildArgs.Version = $env:GITHUB_REF_NAME.TrimStart('v') }
          ./tools/build.ps1 @buildArgs

      - name: Upload build (확인용)
        uses: actions/upload-artifact@v4
        with:
          name: wowaddons
          path: |
            dist/*.zip
            dist/wowaddons-manifest.json
            dist/WowAddonHelper.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/wowaddons-manifest.json
            dist/WowAddonHelper.exe
          generate_release_notes: true
